<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Desempenho de Colaboradores</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #22263a;
    --border: #2e3349;
    --text: #e8eaf0;
    --muted: #7c82a0;
    --green: #22c55e;
    --red: #ef4444;
    --yellow: #eab308;
    --purple: #a78bfa;
    --blue: #60a5fa;
    --orange: #fb923c;
    --tarde: #f59e0b;
    --noite: #818cf8;
    --manha: #34d399;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; min-height: 100vh; }

  header { background: linear-gradient(135deg, #1a1e30 0%, #131620 100%); border-bottom: 1px solid var(--border); padding: 18px 24px; }
  .header-inner { max-width: 1500px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
  .header-title { font-size: 1.3rem; font-weight: 700; }
  .header-title span { color: var(--purple); }
  .header-sub { font-size: 0.75rem; color: var(--muted); margin-top: 3px; }
  .search-box { background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 7px 14px; border-radius: 8px; font-size: 0.82rem; width: 210px; outline: none; }
  .search-box:focus { border-color: var(--purple); }
  .search-box::placeholder { color: var(--muted); }

  /* YEAR TABS */
  .year-nav { max-width: 1500px; margin: 18px auto 0; padding: 0 24px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .ytab { background: var(--surface2); border: 1px solid var(--border); color: var(--muted); padding: 8px 22px; border-radius: 10px; cursor: pointer; font-size: 0.88rem; font-weight: 600; transition: all .15s; }
  .ytab:hover { border-color: var(--purple); color: var(--text); }
  .ytab.active-2025 { background: rgba(167,139,250,.15); border-color: var(--purple); color: var(--purple); }
  .ytab.active-2026 { background: rgba(96,165,250,.15); border-color: var(--blue); color: var(--blue); }
  .ytab .yt-sub { font-size: 0.65rem; display: block; opacity: .7; font-weight: 400; margin-top: 1px; }

  /* FILTERS */
  .filters { max-width: 1500px; margin: 12px auto 0; padding: 0 24px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .filter-label { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; white-space: nowrap; }
  .btn { background: var(--surface2); border: 1px solid var(--border); color: var(--muted); padding: 5px 12px; border-radius: 7px; cursor: pointer; font-size: 0.76rem; transition: all .12s; white-space: nowrap; }
  .btn:hover { border-color: var(--purple); color: var(--text); }
  .btn.active { background: rgba(167,139,250,.14); border-color: var(--purple); color: var(--purple); font-weight: 600; }
  .btn.tarde.active { background: rgba(245,158,11,.12); border-color: var(--tarde); color: var(--tarde); }
  .btn.noite.active { background: rgba(129,140,248,.12); border-color: var(--noite); color: var(--noite); }
  .btn.manha.active { background: rgba(52,211,153,.12); border-color: var(--manha); color: var(--manha); }

  /* STATS */
  .stats-bar { max-width: 1500px; margin: 14px auto 0; padding: 0 24px; display: flex; gap: 10px; flex-wrap: wrap; }
  .stat { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 18px; flex: 1; min-width: 120px; }
  .stat-lbl { font-size: 0.67rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .stat-val { font-size: 1.5rem; font-weight: 700; margin-top: 3px; }

  /* PROMO BANNER */
  .promo-wrap { max-width: 1500px; margin: 16px auto 0; padding: 0 24px; }
  .promo-title { font-size: 0.82rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 8px; }
  .promo-title span { color: var(--purple); }
  .promo-card { background: linear-gradient(135deg, rgba(124,58,237,.18), rgba(167,139,250,.05)); border: 1px solid rgba(167,139,250,.4); border-radius: 12px; padding: 14px 18px; margin-bottom: 8px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .pname { font-size: 1rem; font-weight: 700; color: var(--purple); }
  .pinfo { font-size: 0.75rem; color: var(--muted); margin-top: 2px; }
  .pmonths { font-size: 0.72rem; color: rgba(167,139,250,.8); margin-top: 5px; }
  .ptag { margin-left: auto; background: rgba(167,139,250,.2); border: 1px solid rgba(167,139,250,.5); color: var(--purple); border-radius: 8px; padding: 5px 14px; font-size: 0.82rem; font-weight: 700; white-space: nowrap; }

  /* GRID */
  .grid-wrap { max-width: 1500px; margin: 0 auto; padding: 16px 24px 40px; }
  .divider { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .div-text { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; white-space: nowrap; }
  .div-line { flex: 1; height: 1px; background: var(--border); }
  .count-pill { background: var(--surface2); border: 1px solid var(--border); border-radius: 20px; padding: 2px 10px; font-size: 0.7rem; color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 12px; }
  .empty { grid-column: 1/-1; text-align: center; padding: 60px; color: var(--muted); }

  /* CARD */
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 13px; overflow: hidden; cursor: pointer; transition: transform .12s, box-shadow .12s; }
  .card:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,.4); }
  .card.promo { border-color: rgba(167,139,250,.55); }
  .card.close { border-left: 3px solid var(--orange); }
  .card.newbie { border-left: 3px solid var(--yellow); }

  .ch { padding: 13px 15px 8px; display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .cname { font-size: 0.9rem; font-weight: 700; line-height: 1.25; }
  .crole { font-size: 0.68rem; color: var(--muted); margin-top: 2px; }
  .badges { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
  .badge { font-size: 0.6rem; padding: 2px 7px; border-radius: 20px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; }
  .b-sep { background: rgba(96,165,250,.12); color: var(--blue); border: 1px solid rgba(96,165,250,.25); }
  .b-conf { background: rgba(34,197,94,.12); color: var(--green); border: 1px solid rgba(34,197,94,.25); }
  .b-tarde { background: rgba(245,158,11,.12); color: var(--tarde); border: 1px solid rgba(245,158,11,.25); }
  .b-noite { background: rgba(129,140,248,.12); color: var(--noite); border: 1px solid rgba(129,140,248,.25); }
  .b-manha { background: rgba(52,211,153,.12); color: var(--manha); border: 1px solid rgba(52,211,153,.25); }
  .b-promo { background: rgba(167,139,250,.18); color: var(--purple); border: 1px solid rgba(167,139,250,.45); }
  .b-close { background: rgba(251,146,60,.12); color: var(--orange); border: 1px solid rgba(251,146,60,.25); }
  .b-new { background: rgba(234,179,8,.12); color: var(--yellow); border: 1px solid rgba(234,179,8,.25); }

  /* MONTH CELLS */
  .cms { padding: 2px 15px 13px; }
  .cms-head { font-size: 0.64rem; color: var(--muted); display: flex; justify-content: space-between; margin-bottom: 5px; }
  .cms-head .chits { font-weight: 700; }
  .chits.promo { color: var(--purple); }
  .chits.close { color: var(--orange); }
  .chits.ok { color: var(--blue); }
  .chits.low { color: var(--muted); }
  .mcells { display: grid; gap: 3px; }
  .mc { border-radius: 5px; padding: 5px 2px; text-align: center; border: 1px solid transparent; }
  .mc .ml { font-size: 0.5rem; }
  .mc .mv { font-size: 0.62rem; font-weight: 700; margin-top: 2px; }
  .mc.hit { background: rgba(167,139,250,.18); border-color: rgba(167,139,250,.45); }
  .mc.hit .ml { color: rgba(167,139,250,.65); }
  .mc.hit .mv { color: var(--purple); }
  .mc.miss { background: var(--surface2); border-color: var(--border); }
  .mc.miss .ml { color: var(--muted); opacity: .6; }
  .mc.miss .mv { color: var(--muted); }
  .mc.nd { background: transparent; opacity: .2; border-color: transparent; }
  .mc.nd .mv { color: var(--muted); }

  /* PROG BAR */
  .prog { padding: 0 15px 13px; }
  .prog-bar { background: var(--surface2); border-radius: 4px; height: 5px; overflow: hidden; position: relative; }
  .prog-fill { height: 100%; border-radius: 4px; transition: width .4s; }
  .prog-target { position: absolute; top: -2px; height: 9px; width: 2px; background: rgba(167,139,250,.7); border-radius: 1px; }
  .prog-labels { display: flex; justify-content: space-between; font-size: 0.62rem; color: var(--muted); margin-top: 4px; }

  /* EXPAND */
  .cexp { padding: 10px 15px 13px; border-top: 1px solid var(--border); display: none; }
  .cexp.open { display: block; }
  .er { display: flex; justify-content: space-between; font-size: 0.74rem; padding: 3px 0; border-bottom: 1px solid rgba(46,51,73,.4); }
  .er:last-child { border: none; }
  .ek { color: var(--muted); }
  .ev { color: var(--text); font-weight: 500; text-align: right; }

  /* HIDDEN */
  .hidden { display: none !important; }

  @media (max-width:600px) {
    .grid-wrap,.filters,.stats-bar,.promo-wrap,.year-nav { padding-left:12px; padding-right:12px; }
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div>
      <div class="header-title">📦 Desempenho de <span>Colaboradores</span></div>
      <div class="header-sub">Separadores &amp; Conferentes · Meta: ≥ 8 meses no ano = candidato à promoção de cargo</div>
    </div>
    <input class="search-box" type="text" id="searchInput" placeholder="🔍 Buscar colaborador...">
  </div>
</header>

<div class="year-nav">
  <button class="ytab active-2025" onclick="setYear(2025,this)">📅 2025 <span class="yt-sub">Abr – Dez (9 meses)</span></button>
  <button class="ytab" onclick="setYear(2026,this)">📅 2026 <span class="yt-sub">Jan – Mai (5 meses, em andamento)</span></button>
</div>

<div class="filters">
  <span class="filter-label">Turno:</span>
  <button class="btn active" data-f="shift" data-v="all" onclick="setFilter('shift','all',this)">Todos</button>
  <button class="btn tarde" data-f="shift" data-v="Tarde" onclick="setFilter('shift','Tarde',this)">🌅 Tarde</button>
  <button class="btn noite" data-f="shift" data-v="Noite" onclick="setFilter('shift','Noite',this)">🌙 Noite</button>
  <button class="btn manha" data-f="shift" data-v="Manhã" onclick="setFilter('shift','Manhã',this)">☀️ Manhã</button>
  <span class="filter-label" style="margin-left:8px">Função:</span>
  <button class="btn active" data-f="role" data-v="all" onclick="setFilter('role','all',this)">Todos</button>
  <button class="btn" data-f="role" data-v="Separador" onclick="setFilter('role','Separador',this)">Separador</button>
  <button class="btn" data-f="role" data-v="Conferente" onclick="setFilter('role','Conferente',this)">Conferente</button>
  <span class="filter-label" style="margin-left:8px">Ver:</span>
  <button class="btn active" data-f="status" data-v="all" onclick="setFilter('status','all',this)">Todos</button>
  <button class="btn" data-f="status" data-v="promo" onclick="setFilter('status','promo',this)">⭐ Promovíveis</button>
  <button class="btn" data-f="status" data-v="close" onclick="setFilter('status','close',this)">🔥 Quase lá</button>
  <button class="btn" data-f="status" data-v="new" onclick="setFilter('status','new',this)">🆕 Novos</button>
</div>

<div class="stats-bar" id="statsBar"></div>
<div class="promo-wrap" id="promoWrap"></div>

<div class="grid-wrap">
  <div class="divider">
    <span class="div-text" id="divText">Colaboradores</span>
    <span class="count-pill" id="countBadge">0</span>
    <div class="div-line"></div>
  </div>
  <div class="grid" id="cardsGrid"></div>
</div>

const MONTHS_2025 = MONTHS.filter(m => m.includes('25'));
const MONTHS_2026 = MONTHS.filter(m => m.includes('26'));
const TOTAL_2025 = MONTHS_2025.length; // 9
const TOTAL_2026 = MONTHS_2026.length; // 5

EMPLOYEES.forEach(e => {
  e.hits2025 = MONTHS_2025.filter(m => e.monthly[m]?.hit && e.monthly[m]?.num !== null).length;
  e.hits2026 = MONTHS_2026.filter(m => e.monthly[m]?.hit && e.monthly[m]?.num !== null).length;
  e.promo2025 = e.hits2025 >= 8;
  e.promo2026 = e.hits2026 >= 8;
  e.close2025 = !e.promo2025 && e.hits2025 >= 6;
  e.close2026 = !e.promo2026 && e.hits2026 >= 3;
});

let activeYear = 2025;
let filters = { shift:'all', role:'all', status:'all' };
let search = '';

function setYear(yr, btn) {
  activeYear = yr;
  document.querySelectorAll('.ytab').forEach(b => b.className = 'ytab');
  btn.className = `ytab active-${yr}`;
  render();
}

function setFilter(type, val, btn) {
  filters[type] = val;
  document.querySelectorAll(`[data-f="${type}"]`).forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

document.getElementById('searchInput').addEventListener('input', e => { search = e.target.value.toLowerCase(); render(); });

function getFiltered() {
  return EMPLOYEES.filter(e => {
    if (filters.shift !== 'all' && e.shift !== filters.shift) return false;
    if (filters.role !== 'all' && e.role !== filters.role) return false;
    const promo = activeYear === 2025 ? e.promo2025 : e.promo2026;
    const close = activeYear === 2025 ? e.close2025 : e.close2026;
    if (filters.status === 'promo' && !promo) return false;
    if (filters.status === 'close' && !close) return false;
    if (filters.status === 'new' && !e.is_new) return false;
    if (search && !e.nome.toLowerCase().includes(search)) return false;
    return true;
  });
}

function renderStats(filtered) {
  const yr = activeYear;
  const total = filtered.length;
  const promo = filtered.filter(e => yr===2025?e.promo2025:e.promo2026).length;
  const close = filtered.filter(e => yr===2025?e.close2025:e.close2026).length;
  const newE = filtered.filter(e => e.is_new).length;
  const totalMths = yr===2025 ? TOTAL_2025 : TOTAL_2026;
  const avgHits = total > 0 ? (filtered.reduce((s,e) => s+(yr===2025?e.hits2025:e.hits2026),0)/total).toFixed(1) : 0;

  const promoColor = yr===2025?'var(--purple)':'var(--blue)';
  document.getElementById('statsBar').innerHTML = `
    <div class="stat"><div class="stat-lbl">Colaboradores</div><div class="stat-val" style="color:var(--blue)">${total}</div></div>
    <div class="stat"><div class="stat-lbl">Promovíveis ${yr} (≥8/${totalMths} meses)</div><div class="stat-val" style="color:${promoColor}">${promo}</div></div>
    <div class="stat"><div class="stat-lbl">Quase lá (${yr===2025?'6-7':'3+'} meses)</div><div class="stat-val" style="color:var(--orange)">${close}</div></div>
    <div class="stat"><div class="stat-lbl">Novos colaboradores</div><div class="stat-val" style="color:var(--yellow)">${newE}</div></div>
    <div class="stat"><div class="stat-lbl">Média meses batidos</div><div class="stat-val" style="color:var(--green)">${avgHits}</div></div>
  `;
}

function renderPromo(filtered) {
  const yr = activeYear;
  const promos = filtered.filter(e => yr===2025?e.promo2025:e.promo2026);
  const wrap = document.getElementById('promoWrap');
  if (!promos.length) { wrap.innerHTML=''; return; }
  const months = yr===2025?MONTHS_2025:MONTHS_2026;
  const total = yr===2025?TOTAL_2025:TOTAL_2026;
  wrap.innerHTML = `
    <div class="promo-title">⭐ Candidatos à Promoção de Cargo — <span>${yr}</span> · ${promos.length} colaborador(es)</div>
    ${promos.map(e => {
      const hits = yr===2025?e.hits2025:e.hits2026;
      const hitMonths = months.filter(m=>e.monthly[m]?.hit && e.monthly[m]?.num!==null).join(' · ');
      return `<div class="promo-card">
        <div>
          <div class="pname">${e.nome}</div>
          <div class="pinfo">${e.role} · Turno ${e.shift} · ${e.cargo}</div>
          <div class="pmonths">Meses batidos: ${hitMonths}</div>
        </div>
        <div class="ptag">🏆 ${hits} / ${total} meses</div>
      </div>`;
    }).join('')}
  `;
}

function renderCard(e) {
  const yr = activeYear;
  const months = yr===2025?MONTHS_2025:MONTHS_2026;
  const total = yr===2025?TOTAL_2025:TOTAL_2026;
  const hits = yr===2025?e.hits2025:e.hits2026;
  const promo = yr===2025?e.promo2025:e.promo2026;
  const close = yr===2025?e.close2025:e.close2026;

  const shiftCls = e.shift==='Tarde'?'b-tarde':e.shift==='Noite'?'b-noite':'b-manha';
  const roleCls = e.role==='Separador'?'b-sep':'b-conf';
  const colCount = months.length;

  const cells = months.map(m => {
    const d = e.monthly[m];
    if (!d || d.num===null) return `<div class="mc nd"><div class="ml">${m.replace('/25','').replace('/26','')}</div><div class="mv">—</div></div>`;
    const cls = d.hit?'hit':'miss';
    return `<div class="mc ${cls}" title="${m}: ${d.num} pts (${d.pct}%)"><div class="ml">${m.replace('/25','').replace('/26','')}</div><div class="mv">${d.pct!==null?d.pct+'%':'?'}</div></div>`;
  }).join('');

  const hitsPct = Math.round((hits/total)*100);
  const targetPct = Math.round((8/total)*100);
  const fillColor = promo?'#a78bfa':close?'#fb923c':hits>=2?'#60a5fa':'#4b5563';
  const hitsClass = promo?'promo':close?'close':hits>=3?'ok':'low';

  const noteTxt = promo?'✅ Meta atingida':close?(yr===2025&&hits===7?'⚡ Faltou 1!':'🔥 Quase lá'):'';

  const extraBadges = [
    promo?'<span class="badge b-promo">⭐ Promover</span>':'',
    close&&!promo?'<span class="badge b-close">🔥 Quase</span>':'',
    e.is_new?'<span class="badge b-new">🆕 Novo</span>':''
  ].filter(Boolean).join('');

  const cardCls = promo?'card promo':close?'card close':e.is_new?'card newbie':'card';

  return `
    <div class="${cardCls}" onclick="toggleCard(this)">
      <div class="ch">
        <div>
          <div class="cname">${e.nome}</div>
          <div class="crole">${e.cargo}</div>
        </div>
        <div class="badges">
          <span class="badge ${roleCls}">${e.role}</span>
          <span class="badge ${shiftCls}">${e.shift}</span>
          ${extraBadges}
        </div>
      </div>
      <div class="cms">
        <div class="cms-head">
          <span>📅 ${yr} — ${total} meses${yr===2026?' (em andamento)':''}</span>
          <span class="chits ${hitsClass}">${hits}/${total} batidos ${noteTxt?'· '+noteTxt:''}</span>
        </div>
        <div class="mcells" style="grid-template-columns:repeat(${colCount},1fr)">${cells}</div>
      </div>
      <div class="prog">
        <div class="prog-bar">
          <div class="prog-fill" style="width:${hitsPct}%;background:${fillColor}"></div>
          ${total>=8?`<div class="prog-target" style="left:${targetPct}%"></div>`:''}
        </div>
        <div class="prog-labels">
          <span>0</span>
          ${total>=8?`<span style="color:rgba(167,139,250,.6)">↑ meta (8)</span>`:''}
          <span>${total} meses</span>
        </div>
      </div>
      <div class="cexp">
        <div class="er"><span class="ek">Cargo</span><span class="ev">${e.cargo}</span></div>
        <div class="er"><span class="ek">Função</span><span class="ev">${e.funcao}</span></div>
        <div class="er"><span class="ek">Horário</span><span class="ev">${e.horario}</span></div>
        <div class="er"><span class="ek">Turno</span><span class="ev">${e.shift}</span></div>
        <div class="er"><span class="ek">Primeiro mês com dados</span><span class="ev">${e.first_month||'Abr/25'}</span></div>
        <div class="er"><span class="ek">Metas batidas ${yr}</span><span class="ev" style="color:${promo?'var(--purple)':close?'var(--orange)':'var(--text)'}">${hits} / ${total}</span></div>
        ${promo?`<div class="er"><span class="ek" style="color:var(--purple)">🌟 Status</span><span class="ev" style="color:var(--purple)">Candidato à promoção de cargo</span></div>`:''}
        ${e.is_new?`<div class="er"><span class="ek" style="color:var(--yellow)">🆕 Obs</span><span class="ev" style="color:var(--yellow)">Novo (entrou após Jun/25)</span></div>`:''}
      </div>
    </div>
  `;
}

function toggleCard(card) {
  card.querySelector('.cexp').classList.toggle('open');
}

function render() {
  const filtered = getFiltered();
  renderStats(filtered);
  renderPromo(filtered);
  document.getElementById('countBadge').textContent = filtered.length;
  document.getElementById('divText').textContent = `Colaboradores — ${activeYear}`;
  const grid = document.getElementById('cardsGrid');
  if (!filtered.length) { grid.innerHTML='<div class="empty">Nenhum colaborador encontrado.</div>'; return; }
  const yr = activeYear;
  const sorted = [...filtered].sort((a,b) => {
    const pa = yr===2025?a.promo2025:a.promo2026, pb = yr===2025?b.promo2025:b.promo2026;
    if (pa&&!pb) return -1; if (!pa&&pb) return 1;
    const ha = yr===2025?a.hits2025:a.hits2026, hb = yr===2025?b.hits2025:b.hits2026;
    return hb - ha;
  });
  grid.innerHTML = sorted.map(renderCard).join('');
}

render();
</script>
