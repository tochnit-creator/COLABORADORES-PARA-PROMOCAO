<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Desempenho de Colaboradores</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #22263a;
    --border: #2e3349;
    --text: #e8eaf0;
    --muted: #7c82a0;
    --green: #22c55e;
    --green-dim: #16a34a22;
    --red: #ef4444;
    --red-dim: #dc262622;
    --yellow: #eab308;
    --yellow-dim: #ca8a0422;
    --purple: #a78bfa;
    --purple-dim: #7c3aed22;
    --blue: #60a5fa;
    --blue-dim: #2563eb22;
    --orange: #fb923c;
    --tarde: #f59e0b;
    --noite: #818cf8;
    --manha: #34d399;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; min-height: 100vh; }

  /* HEADER */
  header { background: linear-gradient(135deg, #1e2235 0%, #151825 100%); border-bottom: 1px solid var(--border); padding: 20px 24px; }
  .header-inner { max-width: 1400px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
  .header-title { font-size: 1.4rem; font-weight: 700; color: var(--text); }
  .header-title span { color: var(--purple); }
  .header-sub { font-size: 0.8rem; color: var(--muted); margin-top: 3px; }

  /* STATS BAR */
  .stats-bar { max-width: 1400px; margin: 20px auto; padding: 0 24px; display: flex; gap: 12px; flex-wrap: wrap; }
  .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 20px; flex: 1; min-width: 140px; }
  .stat-label { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .stat-value { font-size: 1.6rem; font-weight: 700; margin-top: 4px; }
  .stat-value.green { color: var(--green); }
  .stat-value.purple { color: var(--purple); }
  .stat-value.yellow { color: var(--yellow); }
  .stat-value.blue { color: var(--blue); }

  /* FILTERS */
  .filters { max-width: 1400px; margin: 0 auto 20px; padding: 0 24px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .filter-group { display: flex; gap: 6px; align-items: center; }
  .filter-label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; white-space: nowrap; }
  .btn { background: var(--surface2); border: 1px solid var(--border); color: var(--muted); padding: 7px 14px; border-radius: 8px; cursor: pointer; font-size: 0.8rem; transition: all .2s; white-space: nowrap; }
  .btn:hover { border-color: var(--purple); color: var(--text); }
  .btn.active { background: var(--purple-dim); border-color: var(--purple); color: var(--purple); font-weight: 600; }
  .btn.tarde.active { background: rgba(245,158,11,.15); border-color: var(--tarde); color: var(--tarde); }
  .btn.noite.active { background: rgba(129,140,248,.15); border-color: var(--noite); color: var(--noite); }
  .btn.manha.active { background: rgba(52,211,153,.15); border-color: var(--manha); color: var(--manha); }
  .search-box { background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 7px 14px; border-radius: 8px; font-size: 0.85rem; width: 200px; outline: none; }
  .search-box:focus { border-color: var(--purple); }
  .search-box::placeholder { color: var(--muted); }

  /* GRID */
  .grid { max-width: 1400px; margin: 0 auto; padding: 0 24px 40px; display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; }

  /* CARD */
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; transition: transform .2s, box-shadow .2s; cursor: pointer; }
  .card:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(0,0,0,.4); }
  .card.promo { border-color: var(--purple); box-shadow: 0 0 0 1px var(--purple)44; }
  .card.new-emp { border-color: var(--yellow); }
  
  .card-header { padding: 16px; display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .card-name { font-size: 0.95rem; font-weight: 700; color: var(--text); line-height: 1.3; }
  .card-role { font-size: 0.72rem; color: var(--muted); margin-top: 3px; }
  .badges { display: flex; gap: 5px; flex-wrap: wrap; justify-content: flex-end; }
  .badge { font-size: 0.65rem; padding: 3px 8px; border-radius: 20px; font-weight: 700; white-space: nowrap; text-transform: uppercase; letter-spacing: .04em; }
  .badge-sep { background: rgba(96,165,250,.15); color: var(--blue); border: 1px solid rgba(96,165,250,.3); }
  .badge-conf { background: rgba(34,197,94,.15); color: var(--green); border: 1px solid rgba(34,197,94,.3); }
  .badge-tarde { background: rgba(245,158,11,.15); color: var(--tarde); border: 1px solid rgba(245,158,11,.3); }
  .badge-noite { background: rgba(129,140,248,.15); color: var(--noite); border: 1px solid rgba(129,140,248,.3); }
  .badge-manha { background: rgba(52,211,153,.15); color: var(--manha); border: 1px solid rgba(52,211,153,.3); }
  .badge-promo { background: rgba(167,139,250,.2); color: var(--purple); border: 1px solid rgba(167,139,250,.5); }
  .badge-new { background: rgba(234,179,8,.15); color: var(--yellow); border: 1px solid rgba(234,179,8,.3); }

  /* HITS BAR */
  .hits-section { padding: 0 16px 12px; }
  .hits-label { font-size: 0.7rem; color: var(--muted); margin-bottom: 6px; display: flex; justify-content: space-between; }
  .hits-label span { color: var(--text); font-weight: 600; }
  .progress-bar { background: var(--surface2); border-radius: 4px; height: 6px; overflow: hidden; }
  .progress-fill { height: 100%; border-radius: 4px; transition: width .5s; }
  .fill-green { background: linear-gradient(90deg, var(--green), #16a34a); }
  .fill-yellow { background: linear-gradient(90deg, var(--yellow), #d97706); }
  .fill-red { background: linear-gradient(90deg, #f87171, var(--red)); }
  .fill-purple { background: linear-gradient(90deg, var(--purple), #7c3aed); }

  /* MONTHS GRID */
  .months-grid { padding: 0 16px 16px; }
  .months-label { font-size: 0.7rem; color: var(--muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: .04em; }
  .month-cells { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .month-cell { border-radius: 5px; padding: 4px 2px; text-align: center; font-size: 0.58rem; border: 1px solid transparent; }
  .month-cell .m-label { color: var(--muted); font-size: 0.55rem; }
  .month-cell .m-pct { font-weight: 700; font-size: 0.68rem; margin-top: 1px; }
  .month-cell.hit { background: rgba(167,139,250,.2); border-color: rgba(167,139,250,.5); }
  .month-cell.hit .m-pct { color: var(--purple); }
  .month-cell.hit .m-label { color: rgba(167,139,250,.7); }
  .month-cell.miss { background: var(--surface2); border-color: var(--border); }
  .month-cell.miss .m-pct { color: var(--muted); }
  .month-cell.no-data { background: transparent; border-color: transparent; opacity: 0.3; }
  .month-cell.no-data .m-pct { color: var(--muted); }

  /* EXPAND */
  .card-expanded { padding: 12px 16px 16px; border-top: 1px solid var(--border); display: none; }
  .card-expanded.open { display: block; }
  .detail-row { display: flex; justify-content: space-between; font-size: 0.78rem; padding: 4px 0; border-bottom: 1px solid var(--border)44; }
  .detail-row:last-child { border-bottom: none; }
  .detail-key { color: var(--muted); }
  .detail-val { color: var(--text); font-weight: 500; text-align: right; }

  /* PROMO SECTION */
  .promo-section { max-width: 1400px; margin: 0 auto 24px; padding: 0 24px; }
  .promo-title { font-size: 1rem; font-weight: 700; color: var(--purple); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
  .promo-title::before { content: '⭐'; }
  .promo-cards { display: flex; gap: 12px; flex-wrap: wrap; }
  .promo-card { background: linear-gradient(135deg, rgba(124,58,237,.2), rgba(167,139,250,.08)); border: 1px solid rgba(167,139,250,.4); border-radius: 12px; padding: 16px 20px; min-width: 220px; flex: 1; }
  .promo-name { font-size: 1rem; font-weight: 700; color: var(--purple); }
  .promo-detail { font-size: 0.78rem; color: var(--muted); margin-top: 4px; }
  .promo-months { font-size: 0.85rem; color: var(--text); font-weight: 600; margin-top: 8px; }

  /* SECTION DIVIDER */
  .section-divider { max-width: 1400px; margin: 4px auto 16px; padding: 0 24px; display: flex; align-items: center; gap: 12px; }
  .divider-label { font-size: 0.78rem; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; white-space: nowrap; }
  .divider-line { flex: 1; height: 1px; background: var(--border); }
  .count-badge { background: var(--surface2); border: 1px solid var(--border); border-radius: 20px; padding: 2px 10px; font-size: 0.72rem; color: var(--muted); }

  /* EMPTY */
  .empty { grid-column: 1/-1; text-align: center; padding: 60px 20px; color: var(--muted); font-size: 0.9rem; }

  @media (max-width: 600px) {
    .grid { padding: 0 12px 40px; }
    .filters { padding: 0 12px; }
    .stats-bar { padding: 0 12px; }
    .month-cells { grid-template-columns: repeat(7, 1fr); }
  }
</style>
</head>

<header>
  <div class="header-inner">
    <div>
      <div class="header-title">📦 Desempenho de <span>Colaboradores</span></div>
      <div class="header-sub">Separadores &amp; Conferentes · Abr/2025 – Mai/2026 · Célula roxa = Meta batida</div>

  <div class="filter-group">

</div>

<div class="promo-section" id="promoSection"></div>

</div>

let filters = { shift: 'all', role: 'all', status: 'all' };
let searchQuery = '';

function setFilter(type, val, btn) {
  filters[type] = val;
  document.querySelectorAll(`[data-filter="${type}"]`).forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

document.getElementById('searchInput').addEventListener('input', e => {
  searchQuery = e.target.value.toLowerCase();
  render();
});

function getFiltered() {
  return EMPLOYEES.filter(e => {
    if (filters.shift !== 'all' && e.shift !== filters.shift) return false;
    if (filters.role !== 'all' && e.role !== filters.role) return false;
    if (filters.status === 'promo' && !e.promotion_candidate) return false;
    if (filters.status === 'new' && !e.is_new) return false;
    if (searchQuery && !e.nome.toLowerCase().includes(searchQuery)) return false;
    return true;
  });
}

function getHitColor(hits) {
  if (hits >= 8) return 'fill-purple';
  if (hits >= 5) return 'fill-green';
  if (hits >= 2) return 'fill-yellow';
  return 'fill-red';
}

function renderStats(filtered) {
  const total = filtered.length;
  const promo = filtered.filter(e => e.promotion_candidate).length;
  const newEmps = filtered.filter(e => e.is_new).length;
  const avgHits = total > 0 ? (filtered.reduce((s,e) => s+e.hits_count,0)/total).toFixed(1) : 0;
  document.getElementById('statsBar').innerHTML = `
    <div class="stat-card"><div class="stat-label">Colaboradores</div><div class="stat-value blue">${total}</div></div>
    <div class="stat-card"><div class="stat-label">Candidatos promoção ≥8 meses</div><div class="stat-value purple">${promo}</div></div>
    <div class="stat-card"><div class="stat-label">Novos na empresa</div><div class="stat-value yellow">${newEmps}</div></div>
    <div class="stat-card"><div class="stat-label">Média meses batidos</div><div class="stat-value green">${avgHits}</div></div>
  `;
}

function renderPromo(filtered) {
  const promos = filtered.filter(e => e.promotion_candidate);
  const sec = document.getElementById('promoSection');
  if (promos.length === 0) { sec.innerHTML = ''; return; }
  sec.innerHTML = `
    <div class="promo-title">Candidatos à Promoção de Cargo (≥8 meses batendo meta)</div>
    <div class="promo-cards">
      ${promos.map(e => `
        <div class="promo-card">
          <div class="promo-name">${e.nome}</div>
          <div class="promo-detail">${e.role} · ${e.shift} · ${e.cargo}</div>
          <div class="promo-months">🏆 ${e.hits_count} meses acima da meta</div>
          <div class="promo-detail" style="margin-top:6px;font-size:.72rem;">
            Meses batidos: ${MONTHS.filter(m => e.monthly[m]?.hit).join(', ')}
          </div>
        </div>
      `).join('')}
    </div>
  `;
}

function renderCard(e) {
  const shiftBadge = e.shift === 'Tarde' ? 'badge-tarde' : e.shift === 'Noite' ? 'badge-noite' : 'badge-manha';
  const roleBadge = e.role === 'Separador' ? 'badge-sep' : 'badge-conf';
  const maxMonths = 14;
  const hitPct = Math.round((e.hits_count / maxMonths) * 100);
  const fillClass = getHitColor(e.hits_count);
  
  const monthCells = MONTHS.map(m => {
    const d = e.monthly[m];
    if (!d || d.num === null) {
      return `<div class="month-cell no-data"><div class="m-label">${m}</div><div class="m-pct">—</div></div>`;
    }
    const cls = d.hit ? 'hit' : 'miss';
    const pct = d.pct !== null ? d.pct + '%' : '?';
    return `<div class="month-cell ${cls}" title="${m}: ${d.num} pts (${pct})"><div class="m-label">${m}</div><div class="m-pct">${pct}</div></div>`;
  }).join('');

  const extraBadges = [
    e.promotion_candidate ? '<span class="badge badge-promo">⭐ Promover</span>' : '',
    e.is_new ? '<span class="badge badge-new">🆕 Novo</span>' : ''
  ].filter(Boolean).join('');

  return `
    <div class="card ${e.promotion_candidate ? 'promo' : ''} ${e.is_new ? 'new-emp' : ''}" onclick="toggleCard(this)">
      <div class="card-header">
        <div>
          <div class="card-name">${e.nome}</div>
          <div class="card-role">${e.cargo}</div>
        </div>
        <div class="badges">
          <span class="badge ${roleBadge}">${e.role}</span>
          <span class="badge ${shiftBadge}">${e.shift}</span>
          ${extraBadges}
        </div>
      </div>
      <div class="hits-section">
        <div class="hits-label">Metas batidas <span>${e.hits_count} / ${maxMonths} meses</span></div>
        <div class="progress-bar"><div class="progress-fill ${fillClass}" style="width:${hitPct}%"></div></div>
      </div>
      <div class="months-grid">
        <div class="months-label">Histórico mensal</div>
        <div class="month-cells">${monthCells}</div>
      </div>
      <div class="card-expanded">
        <div class="detail-row"><span class="detail-key">Cargo</span><span class="detail-val">${e.cargo}</span></div>
        <div class="detail-row"><span class="detail-key">Função</span><span class="detail-val">${e.funcao}</span></div>
        <div class="detail-row"><span class="detail-key">Horário</span><span class="detail-val">${e.horario}</span></div>
        <div class="detail-row"><span class="detail-key">Turno</span><span class="detail-val">${e.shift}</span></div>
        <div class="detail-row"><span class="detail-key">Primeiro mês ativo</span><span class="detail-val">${e.first_month || 'Abr/25'}</span></div>
        <div class="detail-row"><span class="detail-key">Meses batendo meta</span><span class="detail-val">${e.hits_count}</span></div>
        ${e.promotion_candidate ? '<div class="detail-row"><span class="detail-key" style="color:var(--purple)">🌟 Status</span><span class="detail-val" style="color:var(--purple)">Candidato à promoção de cargo</span></div>' : ''}
        ${e.is_new ? '<div class="detail-row"><span class="detail-key" style="color:var(--yellow)">🆕 Obs</span><span class="detail-val" style="color:var(--yellow)">Colaborador novo (entrou após Jun/25)</span></div>' : ''}
      </div>
    </div>
  `;
}

function toggleCard(card) {
  const exp = card.querySelector('.card-expanded');
  exp.classList.toggle('open');
}

function render() {
  const filtered = getFiltered();
  renderStats(filtered);
  renderPromo(filtered);
  document.getElementById('countBadge').textContent = filtered.length;
  const grid = document.getElementById('cardsGrid');
  if (filtered.length === 0) {
    grid.innerHTML = '<div class="empty">Nenhum colaborador encontrado com os filtros selecionados.</div>';
    return;
  }
  // Sort: promo first, then by hits desc
  const sorted = [...filtered].sort((a,b) => {
    if (a.promotion_candidate && !b.promotion_candidate) return -1;
    if (!a.promotion_candidate && b.promotion_candidate) return 1;
    return b.hits_count - a.hits_count;
  });
  grid.innerHTML = sorted.map(renderCard).join('');
}

render();
</script>
